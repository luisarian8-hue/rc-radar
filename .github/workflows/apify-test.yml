name: Apify-Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apify-test
  cancel-in-progress: false

jobs:
  apify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Transfermarkt über Apify testen
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/apify_test.py
      - name: Ergebnis speichern
        run: |
          git config user.name "rc-radar-bot"
          git config user.email "rc-radar-bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Apify-Test $(date +%F)"
          git pull --rebase origin main
          git push
