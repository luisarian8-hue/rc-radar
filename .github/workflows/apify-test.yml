name: Apify-Test

on:
  workflow_dispatch:
    inputs:
      url:
        description: Start-URL
        default: https://www.transfermarkt.com/fortuna-dusseldorf/startseite/verein/38
      extra:
        description: Zweite URL
        default: https://www.transfermarkt.com/schnellsuche/ergebnis/schnellsuche?query=Tchatchoua
      depth:
        description: crawlDepth
        default: '2'

permissions:
  contents: write

concurrency:
  group: apify-test
  cancel-in-progress: false

jobs:
  apify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Transfermarkt über Apify testen
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TM_URL: ${{ inputs.url }}
          TM_EXTRA: ${{ inputs.extra }}
          TM_DEPTH: ${{ inputs.depth }}
        run: python scripts/apify_test.py
      - name: Ergebnis speichern
        run: |
          git config user.name "rc-radar-bot"
          git config user.email "rc-radar-bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Apify-Test $(date +%F)"
          git pull --rebase origin main
          git push
