name: Wochenlauf

on:
  schedule:
    - cron: "17 4 * * 1"   # Montag 05:17 Uhr (MEZ)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: API-Football holen
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/fetch_af.py
      - name: Spielzeit und Verfügbarkeit
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/availability.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Daten speichern
        run: |
          git config user.name "rc-radar-bot"
          git config user.email "rc-radar-bot@users.noreply.github.com"
          git add data/ config/
          git diff --cached --quiet || git commit -m "Wochenlauf $(date +%F)"
          git pull --rebase origin main
          git push
