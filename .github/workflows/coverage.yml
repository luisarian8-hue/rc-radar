name: Coverage-Check

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coverage
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: API-Football prüfen
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/coverage_check.py
      - name: Ergebnis speichern
        run: |
          git config user.name "rc-radar-bot"
          git config user.email "rc-radar-bot@users.noreply.github.com"
          git add reports/coverage.md config/league_ids.json
          git diff --cached --quiet || git commit -m "Coverage-Check $(date +%F)"
          git pull --rebase origin main
          git push
